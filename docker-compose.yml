version: '3.8'

services:
  telvyn-ai:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    env_file:
      - .env
    restart: always

  # Redis for Rate Limiting scaling (optional but recommended for production)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
